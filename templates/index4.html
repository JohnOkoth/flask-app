<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User and Car Information Form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Base URL of the API. Change this if running locally.
        const baseUrl = window.BASE_URL || 'https://flask-app-s3yo.onrender.com';
        document.addEventListener('DOMContentLoaded', function() {
            fetchOptions('car_types', 'carType');
            fetchOptions('vehicle_use', 'vehicleUse');
            fetchOptions('car_years', 'carYear');

            // Slider input listener for biasFactor
            document.getElementById('biasFactor').addEventListener('input', function() {
                document.getElementById('biasFactorValue').textContent = this.value;
            });

            document.getElementById('userInfoForm').addEventListener('input', validateForm);
            validateForm();
        });

        function fetchOptions(endpoint, elementId) {
            fetch(`${baseUrl}/options/${endpoint}`)
                .then(response => response.json())
                .then(data => populateSelect(elementId, data))
                .catch(error => console.error('Error loading ' + endpoint + ':', error));
        }

        function populateSelect(elementId, options) {
            const select = document.getElementById(elementId);
            options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option;
                opt.innerText = option;
                select.appendChild(opt);
            });
        }

        function validateForm() {
            const email = document.getElementById('email').value;
            const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            const requiredValid = Array.from(document.querySelectorAll('#userInfoForm [required]'))
                .every(el => el.value.trim() !== '');
            document.getElementById('submitBtn').disabled = !(emailValid && requiredValid);
            return emailValid && requiredValid;
        }

        function submitForm(event) {
            event.preventDefault(); // Prevent the form from submitting in the traditional way
            if (!validateForm()) {
                return;
            }

            const userInfo = {
                user_id: document.getElementById('userId').value,
                personal_information: {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    dob: document.getElementById('dob').value,
                    gender: document.getElementById('gender').value
                },
                car_information: {
                    type: document.getElementById('carType').value,
                    use: document.getElementById('vehicleUse').value,
                    make: document.getElementById('carMake').value,
                    model: document.getElementById('carModel').value,
                    year: document.getElementById('carYear').value
                },
                bias_factor: parseFloat(document.getElementById('biasFactor').value)  // Include the bias factor
            };

            fetch(`${baseUrl}/user`, {
    		method: 'POST',
    		headers: { 'Content-Type': 'application/json' },
    		body: JSON.stringify(userInfo)
	   })

            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                alert("Submission Successful");
                // Display the computed rates in the form
                document.getElementById('rate').value = data.rate;
                document.getElementById('rate2').value = data.rate2;
                document.getElementById('rate3').value = data.rate3;
                document.getElementById('rate4').value = data.rate4;  // New field for rate4

            })
            .catch(error => console.error('Submission error:', error));
        }

    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container py-4">
    <h2 class="mb-4">Enter User and Car Information</h2>
    <form id="userInfoForm" class="needs-validation" novalidate onsubmit="submitForm(event); return false;">
        <div class="row">
            <div class="col-md-6">
                <fieldset class="border p-3 mb-3">
                    <legend class="w-auto px-2">Personal Information</legend>
                    <div class="mb-3">
                        <label for="userId" class="form-label">User ID</label>
                        <input type="text" class="form-control" id="userId" name="userId" required>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="dob" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="dob" name="dob" required>
                    </div>

                    <div class="mb-3">
                        <label for="gender" class="form-label">Gender</label>
                        <select id="gender" class="form-select" name="gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </fieldset>
            </div>

            <div class="col-md-6">
                <fieldset class="border p-3 mb-3">
                    <legend class="w-auto px-2">Car Information</legend>
                    <div class="mb-3">
                        <label for="vehicleUse" class="form-label">Vehicle Use</label>
                        <select id="vehicleUse" class="form-select" name="vehicleUse" required></select>
                    </div>

                    <div class="mb-3">
                        <label for="carType" class="form-label">Car Type</label>
                        <select id="carType" class="form-select" name="carType" required></select>
                    </div>

                    <div class="mb-3">
                        <label for="carMake" class="form-label">Car Make</label>
                        <input type="text" class="form-control" id="carMake" name="carMake" required>
                    </div>

                    <div class="mb-3">
                        <label for="carModel" class="form-label">Car Model</label>
                        <input type="text" class="form-control" id="carModel" name="carModel" required>
                    </div>

                    <div class="mb-3">
                        <label for="carYear" class="form-label">Car Year</label>
                        <select id="carYear" class="form-select" name="carYear" required></select>
                    </div>
                </fieldset>
            </div>
        </div>

        <fieldset class="border p-3 mb-3">
            <legend class="w-auto px-2">Computed Rates</legend>
            <div class="mb-3">
                <label for="rate" class="form-label">Computed Rate</label>
                <input type="text" class="form-control" id="rate" name="rate" readonly>
            </div>

            <div class="mb-3">
                <label for="rate2" class="form-label">Computed Rate2</label>
                <input type="text" class="form-control" id="rate2" name="rate2" readonly>
            </div>

            <div class="mb-3">
                <label for="biasFactor" class="form-label">Bias Factor</label>
                <input type="range" class="form-range" id="biasFactor" name="biasFactor" min="5.31972" max="5.60282946" value="5.31972" step="0.001" required>
                <span id="biasFactorValue">5.31972</span>
            </div>

            <div class="mb-3">
                <label for="rate3" class="form-label">Computed Rate3 (UBI)</label>
                <input type="text" class="form-control" id="rate3" name="rate3" readonly>
            </div>

            <div class="mb-3">
                <label for="rate4" class="form-label">Computed Rate4 (User-selected Bias)</label>
                <input type="text" class="form-control" id="rate4" name="rate4" readonly>
            </div>
        </fieldset>

        <button type="submit" id="submitBtn" class="btn btn-primary" disabled>Submit</button>
    </form>
</body>
</html>
